<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
        rel="stylesheet" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/main.css" />
    <link rel="stylesheet" href="./public/click.css" />
    <title>🪭 wobby - help us make fans 🪭</title>
</head>

<body>
    <h1>Help us make fans!</h1>
    <div class="gameContainer">
        <button id="make-fan-button" onclick="makeFan()">Assemble Fan</button>
        <div class="metrics">
            <div id="fan-count">0 fans</div>
            <div>Auto assembly rate: <span id="fan-auto-speed">o fps</span></div>
        </div>

        <div class="shopContainer">
            <h2>Shop</h2>
            <ul id="shop">
            </ul>
        </div>
    </div>
    <script>
        /*
            TODO: Add additional shop items (10 total)
            TODO: Add upgrade shop (a shop which allows you to improve already owned stuff)
            TODO: extract JS
            TODO: Style stuff
        */

        let fanCount = 0;
        let maxFanCount = 0;
        let thingTypes = {
            volunteer: {
                key: "volunteer"
                , price: 10
                , description: "A friend, partner, or other exploitable party kind enough to help you out"
                , productionSpeed: 0.2
                , owned: 0
                , show: true
            },
            employee: {
                key: "employee"
                , price: 100
                , description: "A human being, paid as little as possible to slap together fans"
                , productionSpeed: 2
                , owned: 0
                , show: false
            },
            fanpress: {
                key: "fanpress"
                , price: 2000
                , description: "The industrial revolution comes to the fan business with this 2 tonne steel behemoth"
                , productionSpeed: 40
                , owned: 0
                , show: false
            },
            factory: {
                key: "factory"
                , price: 50000
                , description: "Churns out just as many fans as it does great big plumes of black smoke, which is a lot"
                , productionSpeed: 1000
                , owned: 0
                , show: false
            },
            fanputer: {
                key: "fanputer"
                , price: 1000000
                , description: "A state of the art fan assembling super computer that seriously increases your fps"
                , productionSpeed: 20000
                , owned: 0
                , show: false
            },
            stripmine: {
                key: "stripmine"
                , price: 5000000
                , description: "An ancient fan wielding burlesque civilization has led to compacted veins of fans ripe for the picking within the earth's crust"
                , productionSpeed: 100000
                , owned: 0
                , show: false
            },
            fantasyland: {
                key: "fantasyland"
                , price: 25000000
                , description: "Pulls fans directly from the collective unconsciousness of mankind"
                , productionSpeed: 500000
                , owned: 0
                , show: false
            },
        };

        loadGameState();

        Object.values(thingTypes).forEach(element => {
            //Add function to each thing which calculates the current buy price
            element.calculatePrice = p => Math.floor(Math.pow(1.25, element.owned) * element.price);

            document.getElementById("shop").innerHTML +=
                `<li id="${element.key}-li" class="${element.show ? "show" : ""}">
                    <div>
                        <button onclick="buyThing('${element.key}')" disabled>Buy</button>
                        <span class="itemTitle">${element.key}</span>
                    </div>
                    <div class="itemMetrics">
                        Price: <span id="${element.key}-price">${element.calculatePrice()}</span> 🪭 - Owned: <span id="${element.key}-count">${element.owned}</span>
                    </div>
                    <div class="description">${element.description}</div>
                </li>`;
        });

        //Set up game loops

        //Run general game loop every second
        setInterval(gameLoop, 1000);
        //Save game every 10 seconds
        setInterval(saveGameState, 10000);

        function makeFan() {
            fanCount++;
            drawFanCount();
        }

        function drawFanCount() {
            const fanCountEl = document.getElementById('fan-count');
            const fcf = Math.floor(fanCount);
            fanCountEl.innerHTML = fcf === 1
                ? "1 fan"
                : `${fcf} fans`;
        }

        function drawMetrics() {
            const fixedNum = Object.values(thingTypes).reduce((acc, x) => acc += x.owned * x.productionSpeed, 0).toFixed(1);
            document.getElementById("fan-auto-speed").innerHTML = `${fixedNum} fps`;
        }

        function buyThing(thingType) {
            var thing = thingTypes[thingType];
            if (fanCount >= thing.calculatePrice()) {
                fanCount = fanCount - thing.calculatePrice();
                thing.owned++;
                document.getElementById(`${thing.key}-count`).innerHTML = thing.owned;
                document.getElementById(`${thing.key}-price`).innerHTML = thing.calculatePrice();

                drawMetrics();
                drawFanCount();
            }
        }

        function gameLoop() {
            Object.values(thingTypes).forEach(element => {
                fanCount += element.owned * element.productionSpeed;
                var thingElement = document.getElementById(`${element.key}-li`);
                var thingBtnElement = thingElement.getElementsByTagName('button')[0];
                if(fanCount > element.price / 2 && !thingElement.classList.contains('show'))
                {
                    thingElement.classList.add("show");
                }

                if(fanCount >= element.calculatePrice() && !thingElement.classList.contains('canAfford'))
                {
                    thingElement.classList.add("canAfford");
                    thingBtnElement?.removeAttribute("disabled");
                }
                else if(fanCount < element.calculatePrice() && thingElement.classList.contains('canAfford')){
                    thingElement.classList.remove("canAfford");
                    thingBtnElement?.setAttribute("disabled", true);
                }
            });
            drawFanCount();
        }

        function saveGameState() {
            let gameState = {
                fanCount: fanCount,
                thingTypes: thingTypes
            };
            localStorage.setItem('gameState', JSON.stringify(gameState));
        }

        function loadGameState() {
            let gameStateSessionItem = localStorage.getItem('gameState');
            if (gameStateSessionItem) {
                let gameState = JSON.parse(gameStateSessionItem);
                fanCount = gameState.fanCount;

                Object.values(thingTypes).forEach(tt => {
                    let matchingSavedItems = Object.values(gameState.thingTypes).filter(x => x.key == tt.key);
                    if (matchingSavedItems && matchingSavedItems[0]) {
                        tt.owned = matchingSavedItems[0].owned;
                    }
                });

                drawFanCount();
                drawMetrics();
            }
        }
    </script>
</body>

</html>
