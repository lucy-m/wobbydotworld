<!DOCTYPE html>
<html lang="en">  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🪭 wobby - help us make fans 🪭</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Courier Prime";
        padding: 0;
        border: 0;
        margin: 0;
        background-color: hsl(154, 21%, 87%);
      }

      p,
      ul,
      li,
      c1,
      h2 {
        margin: 0;
      }

      p,
      li {
        font-size: max(1rem, min(3.5vw, 1.5rem));
      }

      small {
        font-size: 0.75em;
      }

      h1 {
        font-size: max(2.2rem, min(8vw, 3.5rem));
      }

      h2 {
        font-size: max(1.6rem, min(5vw, 2.5rem));
      }

      .logo {
        width: 100%;
        grid-column: 1;
        grid-row: 1;
      }

      .above-the-fold {
        height: 100vh;
        display: grid;
        align-items: center;
        justify-content: center;
        padding: 0 20vw;
        grid-template-columns: 1fr;
        grid-template-rows: 1fr;
      }

      .v-stack {
        display: flex;
        flex-direction: column;
        row-gap: 30px;
      }

      .v-stack.sections {
        row-gap: max(2rem, min(10vw, 5rem));
      }

      .big {
        row-gap: 100px;
      }

      footer {
        margin-top: 100px;
        padding: 40px 20vw;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .c1,
      .c2,
      .c3,
      .content img {
        filter: drop-shadow(1px 5px 3px hsla(0, 0%, 8%, 0.3))
          drop-shadow(4px 7px 7px hsla(0, 0%, 51%, 0.3));
      }

      .c1 {
        background-color: hsl(306, 41%, 77%);
      }

      .c2 {
        background-color: hsl(148, 44%, 65%);
      }

      .c3 {
        background-color: hsl(206, 36%, 73%);
      }

      h1 {
        margin: 0;
        margin-top: 100px;
        padding-left: 20vw;
      }

      section.content {
        padding: 40px 20vw;
      }

      .bonby {
        max-width: 400px;
        width: 100%;
        margin: auto;
      }
    </style>
  </head>
<body>
    <h1>Help us make fans!</h1>
    <button id="make-fan-button" onclick="makeFan()">Assemble Fan</button>
    <div id="fan-count">0 fans</div>
    <ul id="shop">
    </ul>

    <script>
        /*
            TODO: Ratchet price of shop items with each purchase
            TODO: Add descriptions to UI
            TODO: Add additional shop items
            TODO: Add upgrade shop (a shop which allows you to improve already owned stuff)
            TODO: Add metrics as plyer feedback (e.g. fans per second)
            TODO: extract JS
            TODO: extract CSS
            TODO: Style stuff
        */

        let fanCount = 0;
        let thingTypes = {
            volunteer: { 
                key: "volunteer"
                , price: 10
                , description: "A friend, partner or both kind enough to help you out"
                , productionSpeed: 1
                , owned: 0 
            },
            employee: { 
                key: "employee"
                , price: 100
                , description: "A human being, paid as little as possible to slap together fans"
                , productionSpeed: 2
                , owned: 0 
            }
        };

        Object.values(thingTypes).forEach(element => {
            document.getElementById("shop").innerHTML += 
                `<li>
                    <button onclick="buyThing('${element.key}')">${element.key}</button>
                    Price: ${element.price} 🪭 - Owned: <span id="${element.key}-count">0</span>
                </li>`;
        });

        setInterval(gameLoop, 1000);

        function makeFan() {
            fanCount++;
            drawFanCount();
        }

        function drawFanCount() {
            let fanCountEl = document.getElementById('fan-count');
            fanCountEl.innerHTML = fanCount === 1 
                ? "1 fan" 
                : `${fanCount} fans`;
        }

        function buyThing(thingType) {
            var thing = thingTypes[thingType];
            if(fanCount >= thing.price) {
                thing.owned++;
                document.getElementById(`${thing.key}-count`).innerHTML = thing.owned;
                fanCount = fanCount - thing.price;
                
                drawFanCount();
            }
        }

        function gameLoop(){
            Object.values(thingTypes).forEach(element => {
                fanCount += element.owned * element.productionSpeed;
            });
            drawFanCount();
        }
    </script>
</body>
</html>
