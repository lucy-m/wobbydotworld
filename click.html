<!DOCTYPE html>
<html lang="en">  
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400;1,700&display=swap"
      rel="stylesheet"
    />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./public/main.css" />
    <title>🪭 wobby - help us make fans 🪭</title>
</head>
<body>
    <h1>Help us make fans!</h1>
    <button id="make-fan-button" onclick="makeFan()">Assemble Fan</button>
    <div id="fan-count">0 fans</div>
    <ul id="shop">
    </ul>

    <script>
        /*
            TODO: Ratchet price of shop items with each purchase
            TODO: Add descriptions to UI
            TODO: Add additional shop items
            TODO: Add upgrade shop (a shop which allows you to improve already owned stuff)
            TODO: Add metrics as plyer feedback (e.g. fans per second)
            TODO: extract JS
            TODO: Style stuff
        */

        let fanCount = 0;
        let thingTypes = {
            volunteer: { 
                key: "volunteer"
                , price: 10
                , description: "A friend, partner or both kind enough to help you out"
                , productionSpeed: 1
                , owned: 0 
            },
            employee: { 
                key: "employee"
                , price: 100
                , description: "A human being, paid as little as possible to slap together fans"
                , productionSpeed: 2
                , owned: 0 
            }
        };

        Object.values(thingTypes).forEach(element => {
            document.getElementById("shop").innerHTML += 
                `<li>
                    <button onclick="buyThing('${element.key}')">${element.key}</button>
                    Price: ${element.price} 🪭 - Owned: <span id="${element.key}-count">0</span>
                </li>`;
        });

        setInterval(gameLoop, 1000);

        function makeFan() {
            fanCount++;
            drawFanCount();
        }

        function drawFanCount() {
            let fanCountEl = document.getElementById('fan-count');
            fanCountEl.innerHTML = fanCount === 1 
                ? "1 fan" 
                : `${fanCount} fans`;
        }

        function buyThing(thingType) {
            var thing = thingTypes[thingType];
            if(fanCount >= thing.price) {
                thing.owned++;
                document.getElementById(`${thing.key}-count`).innerHTML = thing.owned;
                fanCount = fanCount - thing.price;
                
                drawFanCount();
            }
        }

        function gameLoop(){
            Object.values(thingTypes).forEach(element => {
                fanCount += element.owned * element.productionSpeed;
            });
            drawFanCount();
        }
    </script>
</body>
</html>
